<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Edad</title>
    <link rel="stylesheet" href="css/estilos.css">

    <!-- Flatpickr CSS desde CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

    <div class="contenedor">
        <h1>Calculadora de Edad</h1>
        <p>Ingresa tu fecha de nacimiento para conocer tu edad exacta.</p>

        <form id="formularioEdad">
            <label for="fechaNacimiento">Fecha de nacimiento:</label>
            <input type="text" id="fechaNacimiento" placeholder="Selecciona tu fecha">
            <button type="submit">Calcular edad</button>
        </form>

        <div id="resultado"></div>
    </div>

    <!-- Flatpickr JS desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <!-- Luxon JS desde CDN -->
    <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>

    <!-- Tu script local corregido -->
    <script src="js/script.js"></script>
</body>

</html>
